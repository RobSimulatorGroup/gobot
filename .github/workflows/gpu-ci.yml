name: GPU CI

on:
  workflow_dispatch:
  # Scheduled GPU CI is temporarily disabled; keep manual dispatch available.
  # schedule:
  #   - cron: "17 18 * * *"

permissions:
  contents: read

concurrency:
  group: gobot-gpu-ci
  cancel-in-progress: false

jobs:
  go1-mujoco-warp:
    name: GPU renderer and Go1 MuJoCo Warp
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Check out renderer and test submodules
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --force --depth=1 \
            3rdparty/gli \
            3rdparty/googletest \
            3rdparty/imgui \
            3rdparty/luisa_compute \
            3rdparty/meshoptimizer \
            3rdparty/pybind11 \
            3rdparty/rttr \
            3rdparty/stb
          git -C 3rdparty/luisa_compute submodule sync --recursive
          git -C 3rdparty/luisa_compute -c protocol.version=2 submodule update \
            --init --force --depth=1 --recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check CUDA runner
        run: |
          nvidia-smi
          nvcc --version

      - name: Install LuisaCompute build tools
        run: |
          uv tool install 'cmake>=3.27'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build LuisaCompute CUDA runtime
        run: cmake --workflow --preset dependencies-render

      - name: Install complete Gobot environment
        env:
          CMAKE_ARGS: "-DGOB_BUILD_OPENUSD=OFF"
          GOBOT_SKIP_DEPENDENCY_BOOTSTRAP: "1"
        run: uv sync

      - name: Configure Luisa renderer integration test
        run: |
          PYTHON_EXECUTABLE="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          cmake -S . -B build_gpu_renderer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGOB_BUILD_TESTS=ON \
            -DGOB_BUILD_ASSIMP=OFF \
            -DGOB_BUILD_MUJOCO=OFF \
            -DGOB_BUILD_LUISA_RENDERER=ON \
            -DGOB_LUISA_COMPUTE_ROOT="$PWD/build/luisa_compute/install" \
            -DGOB_GSPLAT_INFERENCE_ROOT="$PWD/build/gsplat_inference/install" \
            -DPython3_EXECUTABLE="${PYTHON_EXECUTABLE}"
          cmake --build build_gpu_renderer \
            --target test_luisa_renderer_module \
            --parallel "$(nproc)"

      - name: Test Luisa CUDA/OpenGL frame rendering
        run: |
          mkdir -p /tmp/gobot-gpu-ci/luisa-cache
          XDG_CACHE_HOME=/tmp/gobot-gpu-ci/luisa-cache \
          GOBOT_RUN_LUISA_GPU_TEST=1 \
            build_gpu_renderer/tests/test_luisa_renderer_module \
              --gtest_filter=LuisaRendererGpu.* \
              --gtest_color=yes

      - name: Test Python CUDA render product
        run: |
          XDG_CACHE_HOME=/tmp/gobot-gpu-ci/luisa-cache \
          GOBOT_RUN_LUISA_GPU_TEST=1 \
            uv run --no-sync python tests/python/test_render_product_cuda.py

      - name: Validate reference fixture
        run: uv run --no-sync python tests/python/test_go1_reference_fixture.py

      - name: Test MuJoCo Warp provider
        run: uv run --no-sync python tests/python/test_mujoco_warp_provider.py

      - name: Test Newton provider
        env:
          GOBOT_RUN_NEWTON_GPU_TEST: "1"
        run: uv run --no-sync python tests/python/test_newton_provider.py

      - name: Restore pinned Newton G1 assets
        uses: actions/cache@v4
        with:
          path: examples/newton_g1/assets
          key: newton-g1-assets-261cd1f429619d8ef4f546bd788ab9dea906b5e1-v8

      - name: Prepare pinned Newton G1 scene
        run: uv run --no-sync python examples/newton_g1/download_assets.py

      - name: Test Newton G1 admission
        env:
          GOBOT_RUN_NEWTON_G1_GPU_TEST: "1"
        run: uv run --no-sync python tests/python/test_newton_g1_gpu.py

      - name: Benchmark Newton G1
        run: |
          mkdir -p /tmp/gobot-gpu-ci/benchmarks
          uv run --no-sync python benchmark/newton_g1_benchmark.py \
            --envs 1,32,128 \
            --ticks 1000 \
            --output /tmp/gobot-gpu-ci/benchmarks/newton_g1.json

      - name: Test Go1 MuJoCo Warp task
        run: uv run --no-sync python tests/python/test_go1_mujoco_warp_env.py

      - name: Install pinned Go1 reference dynamics stack
        run: |
          mkdir -p /tmp/gobot-gpu-ci/go1-reference-stack
          uv pip install \
            --target /tmp/gobot-gpu-ci/go1-reference-stack \
            --no-deps \
            warp-lang==1.14.0 \
            mujoco-warp==3.10.0.1
          uv pip install \
            --target /tmp/gobot-gpu-ci/go1-reference-stack \
            --no-deps \
            --default-index https://py.mujoco.org \
            mujoco==3.10.1.dev946137815

      - name: Test pinned Go1 reference parity
        env:
          PYTHONPATH: /tmp/gobot-gpu-ci/go1-reference-stack
        run: uv run --no-sync python tests/python/test_go1_reference_parity.py

      - name: Benchmark Go1 MuJoCo Warp
        run: |
          mkdir -p /tmp/gobot-gpu-ci/benchmarks
          for num_envs in 256 1024 2048; do
            uv run --no-sync python benchmark/go1_velocity_benchmark.py \
              --backend mujoco-warp \
              --device cuda:0 \
              --num-envs "${num_envs}" \
              --steps 50 \
              --warmup-steps 10 \
              --no-step-extras \
              --json-out "/tmp/gobot-gpu-ci/benchmarks/go1_warp_${num_envs}.json"
          done

      - name: Check MuJoCo Warp benchmark admission
        run: |
          uv run --no-sync python benchmark/check_go1_warp_admission.py \
            /tmp/gobot-gpu-ci/benchmarks/go1_warp_256.json \
            /tmp/gobot-gpu-ci/benchmarks/go1_warp_1024.json \
            /tmp/gobot-gpu-ci/benchmarks/go1_warp_2048.json \
            --minimum-throughput 256=8000 \
            --minimum-throughput 1024=16000 \
            --minimum-throughput 2048=25000 \
            --minimum-scale-factor 1.05

      - name: Run PPO admission training
        run: |
          mkdir -p /tmp/gobot-gpu-ci/training
          uv run --no-sync python -m examples.go1.train.go1_velocity_train \
            --backend mujoco-warp \
            --device cuda:0 \
            --num-envs 256 \
            --iterations 3 \
            --save-interval 3 \
            --no-step-extras \
            --log-dir /tmp/gobot-gpu-ci/training \
            --policy-out /tmp/gobot-gpu-ci/training/policy.pt

      - name: Upload GPU results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gobot-go1-gpu-results
          path: /tmp/gobot-gpu-ci
          if-no-files-found: warn
          retention-days: 14
